<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="">

        <label for="">Full Name:</label>
        <br>
        <input type="text" placeholder="Enter Your Name" required>

        <br>
        <br>

        <label for="">Email:</label>
        <br>
        <input type="email" placeholder="Enter Your Email" required>

        <br>
        <br>
        <label for="">Password:</label>
        <br>
        <input type="password" required>

        <br>
        <br>

        <p>GENDER:</p>
        <label for="male"><input type="radio" name="gender" id="male" required>Male</label>
        <label for="female"><input type="radio" name="gender" id="female" required>Female</label>
        <br>
        <br>
        <p>Skills:</p>
        <label for="html"><input type="checkbox" name="Skills" id="html" >HTML</label>
        <label for="css"><input type="checkbox" name="Skills" id="css" >CSS</label>
        <label for="js"><input type="checkbox" name="Skills" id="js" >JAVASCRIPT</label>
        <br>
        <br>
        <p>Date Of Birth:</p>
        <label for=""><input type="date" required></label>
        <br>
        <br>
        <button type="submit">REGISTER</button>
    </form>
    <hr>
    <h1>Submitted Students (Dummy Data)</h1>
    <table border="1" cellspacing="8">
        <tr>
            <th>NAME</th>
            <th>EMAIL</th>
            <th>GENDER</th>
            <th>SKILLS</th>
            <th>DOB</th>
        </tr>
        <tr>
            <td>alice</td>
            <td>alice@example.com</td>
            <td>Female</td>
            <td>HTML,CSS</td>
            <td>2002-05-10</td>
        </tr>
        <tr>
            <td>bob</td>
            <td>bob@example.com</td>
            <td>Male</td>
            <td>JAVASCRIPT</td>
            <td>2001-11-22</td>
        </tr>
    </table>
</body>
</html>
